# tools.allow is an ALLOWLIST: an absent tool never becomes a schema.
# Target <=30 tools total -- schema bloat is a hard TPM failure, not a cost.

servers:
  # Remote HTTP, so no subprocess. Built first for that reason.
  - id: github
    transport: http
    url: https://api.githubcopilot.com/mcp/
    headers:
      Authorization: "Bearer ${GITHUB_PAT}"
    tools:
      allow:
        - search_repositories
        - get_file_contents
        - list_issues
        - issue_write
    timeout_s: 30

  # No key, no signup. Tavily is a drop-in swap if quality disappoints.
  - id: search
    transport: stdio
    command: uvx
    args: ["duckduckgo-mcp-server"]
    tools:
      allow: [search, fetch_content]
    lazy: true
    idle_kill_s: 600
    timeout_s: 30

  # Local npm server: the hosted Notion MCP needs user OAuth and cannot run headless.
  - id: notion
    transport: stdio
    command: npx
    args: ["-y", "@notionhq/notion-mcp-server"]
    env:
      NOTION_TOKEN: "${NOTION_TOKEN}"
    # Names verified against the running server; the friendly ones do not exist.
    # -markdown variants over block-level ones: nested block JSON burns the budget.
    tools:
      allow:
        - API-post-search
        - API-retrieve-page-markdown
        - API-post-page
        - API-update-page-markdown
    lazy: true
    idle_kill_s: 600

  # gmail:drafts, NOT --tools gmail: the latter requests gmail.send in the
  # consent URL. Levels are cumulative, so drafts grants read+compose, never send.
  - id: gmail
    transport: stdio
    command: uvx
    args: ["workspace-mcp", "--single-user", "--permissions", "gmail:drafts"]
    # This server reads CLIENT_ID/CLIENT_SECRET, not the *_SECRETS path.
    env:
      GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID}"
      GOOGLE_OAUTH_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET}"
      GOOGLE_OAUTH_CLIENT_SECRETS: "${GOOGLE_OAUTH_CLIENT_SECRETS}"
    tools:
      allow: [search_gmail_messages, get_gmail_message_content, draft_gmail_message]
    lazy: true
    idle_kill_s: 900
