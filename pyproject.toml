[project]
name = "mehullm"
version = "0.1.0"
description = "A personal AI agent that talks like me and can act on my behalf."
readme = "README.md"
requires-python = "==3.11.*"

# Week 1-3 only needs the data pipeline. Backend/ML deps live in optional groups
# so the base install stays small -- this machine has ~0.4 GB free RAM.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "regex>=2024.9.11",          # \p{Devanagari} unicode property classes; `re` cannot do this
    "python-dateutil>=2.9",
    "httpx>=0.27",               # talks to local Ollama; no `ollama` package needed
    # Windows ships NO system tz database, so zoneinfo.ZoneInfo() raises at
    # import. Gemini's quota resets at midnight America/Los_Angeles, so this is
    # required, not optional.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
# The FastAPI backend (week 5+).
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "tenacity>=9.0",
    "google-genai>=2.18,<3",
    "openai>=1.54",              # pointed at Groq's OpenAI-compatible endpoint
    "mcp>=2.0",
]
# Local embeddings + vector store (week 4+). fastembed is ONNX -- NO torch, deliberately.
memory = [
    "fastembed>=0.4",
    "sqlite-vec>=0.1.6",
    "indic-transliteration>=2.3",
]
dev = ["ruff>=0.7"]

[project.scripts]
mehullm-parse = "mehullm.pipeline.cli:main"
mehullm-memory = "mehullm.memory.cli:main"
mehullm-eval = "mehullm.eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mehullm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # long regex/comment lines are clearer unwrapped

